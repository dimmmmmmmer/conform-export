name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build download
        run: |
          # export-ignore in .gitattributes keeps tests and CI files out of the zip
          git archive --format=zip --prefix=conform-export/ -o conform-export.zip "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" conform-export.zip --title "Conform Export ${GITHUB_REF_NAME#v}" --notes-file notes.md
